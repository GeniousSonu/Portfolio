title = "Gitleaks Configuration for Portfolio Repository"

[extend]
useDefault = true

[allowlist]
description = "Global allowlist for public keys and test fixtures"
paths = [
  '''scripts/test-sentry-suite\.mjs''',
  '''tests/sentry\.test\.js''',
  '''\.env\.example''',
  '''package-lock\.json''',
]
regexes = [
  '''NEXT_PUBLIC_TURNSTILE_SITE_KEY''',
  '''1x00000000000000000000AA''',
]
