<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="heartGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="60%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <filter id="heartGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Pulsing Glow Outline -->
  <path d="M50 82 C20 62, 10 40, 22 24 C34 8, 48 18, 50 26 C52 18, 66 8, 78 24 C90 40, 80 62, 50 82 Z" fill="url(#heartGrad)" filter="url(#heartGlow)"/>
  <!-- Highlight / Sheen -->
  <path d="M26 28 C30 18, 38 18, 42 22" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
  <!-- Small Star Sparkles -->
  <polygon points="76,16 78,20 82,20 79,23 80,27 76,24 72,27 73,23 70,20 74,20" fill="#ffffff"/>
  <polygon points="20,54 21,57 24,57 22,59 23,62 20,60 17,62 18,59 16,57 19,57" fill="#ffffff" opacity="0.8"/>
</svg>
