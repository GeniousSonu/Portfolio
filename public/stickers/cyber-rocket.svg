<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="rocketBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="flameGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="50%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Exhaust Flame -->
  <path d="M45 70 C40 85, 50 96, 50 96 C50 96, 60 85, 55 70 Z" fill="url(#flameGrad)" filter="url(#glow)"/>
  <path d="M47 70 C44 78, 50 86, 50 86 C50 86, 56 78, 53 70 Z" fill="#ffffff"/>
  <!-- Fins -->
  <path d="M30 62 L42 54 L40 68 Z" fill="#ec4899"/>
  <path d="M70 62 L58 54 L60 68 Z" fill="#ec4899"/>
  <!-- Rocket Body -->
  <path d="M50 8 C38 28, 38 64, 40 68 L60 68 C62 64, 62 28, 50 8 Z" fill="url(#rocketBody)"/>
  <!-- Window Glass -->
  <circle cx="50" cy="34" r="9" fill="#030712" stroke="#38bdf8" stroke-width="2.5"/>
  <circle cx="50" cy="34" r="6" fill="#10b981"/>
  <circle cx="48" cy="32" r="2" fill="#ffffff"/>
  <!-- Nosecone Tip -->
  <path d="M50 8 C46 16, 44 24, 44 24 L56 24 C56 24, 54 16, 50 8 Z" fill="#f43f5e"/>
</svg>
