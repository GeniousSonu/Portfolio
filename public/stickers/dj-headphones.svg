<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Headband Arc -->
  <path d="M22 55 C22 22, 78 22, 78 55" fill="none" stroke="url(#neonCyan)" stroke-width="7" stroke-linecap="round" filter="url(#neonGlow)"/>
  <!-- Top Headband Cushion -->
  <path d="M34 26 C42 22, 58 22, 66 26" fill="none" stroke="#0f172a" stroke-width="4.5" stroke-linecap="round"/>
  <!-- Left Ear Cup -->
  <rect x="14" y="50" width="16" height="30" rx="8" fill="#1e293b" stroke="#06b6d4" stroke-width="2.5"/>
  <rect x="12" y="55" width="6" height="20" rx="3" fill="#0f172a"/>
  <!-- Right Ear Cup -->
  <rect x="70" y="50" width="16" height="30" rx="8" fill="#1e293b" stroke="#06b6d4" stroke-width="2.5"/>
  <rect x="82" y="55" width="6" height="20" rx="3" fill="#0f172a"/>
  <!-- Soundwave / Equalizer Bars in center -->
  <line x1="42" y1="56" x2="42" y2="70" stroke="#10b981" stroke-width="3" stroke-linecap="round"/>
  <line x1="50" y1="48" x2="50" y2="78" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
  <line x1="58" y1="52" x2="58" y2="74" stroke="#ec4899" stroke-width="3" stroke-linecap="round"/>
</svg>
