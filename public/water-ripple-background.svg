<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" fill="none">
  <rect width="1600" height="900" fill="#050505"/>
  <rect width="1600" height="900" fill="url(#surface)" opacity=".9"/>
  <circle cx="800" cy="450" r="500" fill="url(#glow)" opacity=".15"/>
  <defs>
    <linearGradient id="surface" x1="0" y1="0" x2="1600" y2="900" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0c0e14"/>
      <stop offset="0.5" stop-color="#07080c"/>
      <stop offset="1" stop-color="#040406"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientTransform="translate(800 450) rotate(90) scale(500)">
      <stop stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>
</svg>
